resources:
  # Secret scopes for different environments
  secret_scopes:
    redis_secrets_dev:
      name: "redis-secrets-dev"
      
    redis_secrets_staging:
      name: "redis-secrets-staging"
      
    redis_secrets_prod:
      name: "redis-secrets-prod"
      initial_manage_principal: "users"  # Allow users to manage initially
      
  # Secrets (values will be set via CLI or Azure Key Vault)  
  secrets:
    # Development Redis secrets
    redis_host_dev:
      scope: redis-secrets-dev
      key: "host"
      # Value should be set via: databricks secrets put --scope redis-secrets-dev --key host
      
    redis_port_dev:
      scope: redis-secrets-dev  
      key: "port"
      
    redis_password_dev:
      scope: redis-secrets-dev
      key: "password"
      
    redis_ssl_dev:
      scope: redis-secrets-dev
      key: "ssl"
      
    # Staging Redis secrets
    redis_host_staging:
      scope: redis-secrets-staging
      key: "host"
      
    redis_port_staging:
      scope: redis-secrets-staging
      key: "port"
      
    redis_password_staging:
      scope: redis-secrets-staging
      key: "password"
      
    redis_ssl_staging:
      scope: redis-secrets-staging
      key: "ssl"
      
    # Production Redis secrets  
    redis_host_prod:
      scope: redis-secrets-prod
      key: "host"
      
    redis_port_prod:
      scope: redis-secrets-prod
      key: "port"
      
    redis_password_prod:
      scope: redis-secrets-prod
      key: "password"
      
    redis_ssl_prod:
      scope: redis-secrets-prod
      key: "ssl"